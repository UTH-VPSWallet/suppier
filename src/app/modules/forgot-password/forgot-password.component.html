<div class="auth-page">
  <div class="auth-card" style="max-width: 460px;">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">VW</div>
      <h1 class="auth-logo__title">Quên Mật Khẩu</h1>
      <p class="auth-logo__sub">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu</p>
    </div>

    @if (!emailSent) {
      <!-- Form -->
      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">📧</span>
            <input type="email" placeholder="admin@vpswallet.vn" class="auth-input" />
          </div>
        </div>

        <button type="submit" class="auth-btn">
          Gửi Link Đặt Lại
        </button>
      </form>
    } @else {
      <!-- Success State -->
      <div class="auth-success">
        <div class="auth-success__icon">✉️</div>
        <h3 class="auth-success__title">Đã Gửi Email!</h3>
        <p class="auth-success__desc">
          Chúng tôi đã gửi link đặt lại mật khẩu đến hộp thư của bạn. Vui lòng kiểm tra email (bao gồm cả thư mục spam).
        </p>
        <button class="auth-btn auth-btn--outline" (click)="emailSent = false">
          Gửi lại email
        </button>
      </div>
    }

    <p class="auth-footer-text">
      Nhớ mật khẩu rồi?
      <a routerLink="/login" class="auth-link">Quay lại Đăng nhập</a>
    </p>
  </div>
</div>
