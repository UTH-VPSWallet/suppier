<div class="auth-page">
  <div class="auth-card" style="max-width: 460px;">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">VW</div>
      <h1 class="auth-logo__title">Quên Mật Khẩu</h1>
      <p class="auth-logo__sub">Nhập email và Phone đã đăng ký để đặt lại mật khẩu</p>
    </div>

    @if (!emailSent) {
      <!-- Form -->
      <form class="auth-form" [formGroup]="forgotPassForm" (submit)="onSubmit($event)">
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">📧</span>
            <input type="email" formControlName="Email" placeholder="admin@vpswallet.vn" class="auth-input" />
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-label">Phone</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">📞</span>
            <input formControlName="Phone" placeholder="0121973213" class="auth-input" />
          </div>
        </div>
        <div class="err">{{err}}</div>
        <button type="submit" class="auth-btn">
          Lấy Mật Khẩu Mới
        </button>
      </form>
    } @else {
      <!-- Success State -->
      <div class="auth-success">
        <div class="auth-success__icon">🔑</div>
        <h3 class="auth-success__title">MẬT KHẨU MỚI LÀ</h3>
        <p class="auth-success__new-pass">{{ newPassword }}</p>
        <p class="auth-success__desc">
          Vui lòng đăng nhập bằng mật khẩu mới và đổi mật khẩu ngay sau khi đăng nhập để bảo mật tài khoản của bạn.
        </p>
        <!-- <button class="auth-btn auth-btn--outline" (click)="emailSent = false">
          Gửi lại email
        </button> -->
      </div>
    }

    <p class="auth-footer-text">
      Nhớ mật khẩu rồi?
      <a routerLink="/login" class="auth-link">Quay lại Đăng nhập</a>
    </p>
  </div>
</div>
