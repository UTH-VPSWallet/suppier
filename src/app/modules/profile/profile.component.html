<div class="profile-container">
  <!-- Thông tin người dùng -->
  <div class="profile-card">
    <div class="card-header">
      <h2 class="card-title">Hồ Sơ Cá Nhân</h2>
    </div>
    <div class="profile-info">
      <div class="profile-avatar">{{ getShortName(auth.Name) }}</div>
      <div class="profile-details">
        <h3>{{ auth.Name }}</h3>
        <p>{{ auth.Email }}</p>
        <span class="role-badge">Supplier</span>
      </div>
    </div>
  </div>

  <!-- Đổi mật khẩu -->
  <div class="profile-card">
    <div class="card-header">
      <h2 class="card-title">Đổi Mật Khẩu</h2>
    </div>
    @if (errorMessage) { <div class="alert alert-error">{{ errorMessage }}</div> }
    <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
      <div class="form-group">
        <label class="form-label">Mật khẩu hiện tại</label>
        <input type="password" class="form-input" placeholder="Nhập mật khẩu hiện tại" formControlName="currentPassword" />
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu mới</label>
        <input type="password" class="form-input" placeholder="Nhập mật khẩu mới" formControlName="newPassword" />
      </div>
      <div class="form-group">
        <label class="form-label">Xác nhận mật khẩu mới</label>
        <input type="password" class="form-input" placeholder="Nhập lại mật khẩu mới" formControlName="confirmPassword" />
      </div>
      <button type="submit" class="btn-submit" [disabled]="loading">Cập Nhật Mật Khẩu</button>
    </form>
  </div>
</div>
