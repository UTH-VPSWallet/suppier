<div class="auth-page">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">VW</div>
      <h1 class="auth-logo__title">VPS Wallet CRM</h1>
      <p class="auth-logo__sub">Đăng nhập vào hệ thống quản trị</p>
    </div>

    <!-- Form -->
    <form class="auth-form" [formGroup]="loginForm" (submit)="onSubmit()">
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon">📧</span>
          <input type="email" placeholder="admin@vpswallet.vn" class="auth-input" formControlName="Email" />
        </div>
      </div>

      <div class="auth-field">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="auth-label">Mật khẩu</label>
          <a routerLink="/forgot-password" class="auth-link-sm">Quên mật khẩu?</a>
        </div>
        <div class="auth-input-wrap">
          <span class="auth-input-icon">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" class="auth-input" formControlName="Pass" />
          <button type="button" class="auth-toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
        <input type="checkbox" id="remember" style="accent-color: #22c55e;" />
        <label for="remember" style="font-size: 13px; color: #64748b; cursor: pointer;">Ghi nhớ đăng nhập</label>
      </div> -->
      <div class="err">{{loginErr}}</div>
      <button type="submit" class="auth-btn">
        Đăng Nhập
      </button>
    </form>

    <!-- Divider -->
    <!-- <div class="auth-divider">
      <span>hoặc</span>
    </div> -->

    <!-- Social -->
    <!-- <div class="auth-social-row">
      <button class="auth-social-btn">🔴 Google</button>
      <button class="auth-social-btn">🔵 Microsoft</button>
    </div> -->

    <!-- <p class="auth-footer-text">
      Chưa có tài khoản?
      <a routerLink="/register" class="auth-link">Đăng ký ngay</a>
    </p> -->
  </div>

  <!-- Branding -->
  <div class="auth-branding">
    <div class="auth-branding__inner">
      <div class="auth-branding__icon">🖥️</div>
      <h2 class="auth-branding__title">Quản Lý VPS<br/>Thông Minh</h2>
      <p class="auth-branding__desc">Nền tảng CRM hàng đầu giúp bạn quản lý khách hàng, đơn hàng và nhà cung cấp VPS hiệu quả.</p>
      <div class="auth-branding__stats">
        <div class="auth-branding__stat">
          <div class="auth-branding__stat-value">3,642</div>
          <div class="auth-branding__stat-label">Khách hàng</div>
        </div>
        <div class="auth-branding__stat">
          <div class="auth-branding__stat-value">₫48.5M</div>
          <div class="auth-branding__stat-label">Doanh thu</div>
        </div>
        <div class="auth-branding__stat">
          <div class="auth-branding__stat-value">99.9%</div>
          <div class="auth-branding__stat-label">Uptime</div>
        </div>
      </div>
    </div>
  </div>
</div>
